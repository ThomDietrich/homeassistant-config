automation:
  - alias: Wasserzähler Leckage letzte Nacht erkannt
    triggers:
      - trigger: time
        at: "09:00:00"
    conditions:
      - condition: numeric_state
        entity_id: sensor.wasserzaehler_zeit_seit_stundenweiser_null_wassermenge
        above: 12
    actions:
      - action: script.notify_info
        data:
          msg_title: AWF1877 Wasserzähler
          msg_text: Anhaltender Wasserfluss über Nacht festgestellt. Bitte prüfen.
