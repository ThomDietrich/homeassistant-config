template:
  - button:
      - name: Kinderzimmer Teufel Soundsystem Input IR
        unique_id: uniqueid__ir_teufel_input_ir_cmd
        icon: mdi:remote
        availability: >
          {{ is_state("binary_sensor.kinderzimmer_zmote_ping", "on") }}
        press:
          - action: remote.send_command
            target:
              entity_id: remote.teufel_soundsystem
            data:
              command: INPUT

      - name: Kinderzimmer Teufel Soundsystem Volume Up IR
        unique_id: uniqueid__ir_teufel_vol_up_ir_cmd
        icon: mdi:remote
        availability: >
          {{ is_state("binary_sensor.kinderzimmer_zmote_ping", "on") }}
        press:
          - action: remote.send_command
            target:
              entity_id: remote.teufel_soundsystem
            data:
              command: VOL+

      - name: Kinderzimmer Teufel Soundsystem Volume Down IR
        unique_id: uniqueid__ir_teufel_vol_down_ir_cmd
        icon: mdi:remote
        availability: >
          {{ is_state("binary_sensor.kinderzimmer_zmote_ping", "on") }}
        press:
          - action: remote.send_command
            target:
              entity_id: remote.teufel_soundsystem
            data:
              command: VOL-

      - name: Kinderzimmer Epson Beamer Power IR
        unique_id: uniqueid__ir_epson_power_ir_cmd
        icon: mdi:remote
        availability: >
          {{ is_state("binary_sensor.kinderzimmer_zmote_ping", "on") }}
        press:
          - action: remote.send_command
            target:
              entity_id: remote.epson_eh_tw3200
            data:
              command: POWER
