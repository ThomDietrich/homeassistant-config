light:
  - platform: switch
    name: Vorbau Hoflicht
    entity_id: switch.vorbau_dreifachtaster_vorbau_hoflicht

automation:
  ##############################################################################
  # Vorbau Dreifachtaster
  #   Taster links:  Schaltet Pferdestall und Scheune
  #   Taster mitte:  Schaltet Irenes Licht ein und wartet die internen 6min ab
  #   Taster rechts: Schaltet Relay direkt, keine weitere Automation erforderlich
  - alias: Vorbau Dreifachtaster Linker Taster
    triggers:
      - trigger: state
        entity_id: switch.vorbau_dreifachtaster_button_garage
        to:
          - "on"
          - "off"
    actions:
      - action: "light.turn_{{ trigger.to_state.state }}"
        target:
          entity_id:
            - light.scheune_hoflicht
            - light.pferdestall_hoflicht

  - alias: Vorbau Dreifachtaster Linke LED folgt Status
    description: Der Lichtschalter hat LEDs und die linke soll immer den korrekten Zustand vom Pferdestall Licht zeigen
    triggers:
      - trigger: state
        entity_id: light.pferdestall_hoflicht
        to:
          - "on"
          - "off"
    actions:
      - action: "switch.turn_{{ trigger.to_state.state }}"
        target:
          entity_id: switch.vorbau_dreifachtaster_button_garage

  - alias: Vorbau Dreifachtaster Mittlerer Taster ein
    triggers:
      - trigger: state
        entity_id: switch.vorbau_dreifachtaster_button_irene
        to: "on"
    conditions:
      - condition: state
        entity_id: binary_sensor.hoflicht_irene_milchhaus_status
        state: "off"
    actions:
      - action: button.press
        target:
          entity_id: button.hoflicht_irene_milchhaus_ausloser

  - alias: Vorbau Dreifachtaster Mittlerer Taster kann nicht ausgeschaltet werden
    triggers:
      - trigger: state
        entity_id: switch.vorbau_dreifachtaster_button_irene
        to: "off"
    conditions:
      - condition: state
        entity_id: binary_sensor.hoflicht_irene_milchhaus_status
        state: "on"
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.vorbau_dreifachtaster_button_irene

  - alias: Vorbau Dreifachtaster Mittlere LED folgt Status
    triggers:
      - trigger: state
        entity_id: binary_sensor.hoflicht_irene_milchhaus_status
        to:
          - "on"
          - "off"
    actions:
      - action: "switch.turn_{{ trigger.to_state.state }}"
        target:
          entity_id: switch.vorbau_dreifachtaster_button_irene

  ##############################################################################
  # Vorbau Hoflicht folgt Irene Licht
  - alias: Vorbaulicht folgt Hoflicht Irene - ON
    description: Schalte Vorbaulicht mit Irenes Licht ein, WENN noch nicht aktiv
    triggers:
      - trigger: state
        entity_id: binary_sensor.hoflicht_irene_milchhaus_status
        to: "on"
    conditions:
      - condition: state
        entity_id: light.vorbau_hoflicht
        state: "off"
    actions:
      - action: light.turn_on
        target:
          entity_id: light.vorbau_hoflicht
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.flag_vorbau_hoflicht_folgt_irene_hoflicht

  - alias: Vorbaulicht folgt Hoflicht Irene - OFF
    description: Schalte Vorbaulicht mit Irenes Licht aus, WENN dadurch eingeschaltet
    triggers:
      - trigger: state
        entity_id: binary_sensor.hoflicht_irene_milchhaus_status
        to: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.flag_vorbau_hoflicht_folgt_irene_hoflicht
        state: "on"
    actions:
      - action: light.turn_off
        target:
          entity_id: light.vorbau_hoflicht
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.flag_vorbau_hoflicht_folgt_irene_hoflicht

  - alias: Vorbaulicht folgt Hoflicht Irene - Unterbreche Folgen
    description: Deaktiviere Folgen-Flag wenn Vorbau Licht geschaltet wird
    triggers:
      - trigger: state
        entity_id: light.vorbau_hoflicht
      - trigger: state
        entity_id: light.pferdestall_hoflicht
    conditions:
      - condition: state
        entity_id: input_boolean.flag_vorbau_hoflicht_folgt_irene_hoflicht
        state: "on"
        for:
          seconds: 3
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.flag_vorbau_hoflicht_folgt_irene_hoflicht

  ##############################################################################
  # Ikea Shortcut Taster in Küche oben
  - alias: Reaktion auf IKEA Minitaster Küche ein (pt1)
    triggers:
      - trigger: device
        domain: mqtt
        device_id: 537c1f38a46cecfee54500d2db1e5537
        type: action
        subtype: "on"
    conditions:
      - alias: Licht ist aktuell aus
        condition: state
        entity_id: light.vorbau_hoflicht
        state: "off"
    actions:
      - action: light.turn_on
        target:
          entity_id: light.vorbau_hoflicht

  - alias: Reaktion auf IKEA Minitaster Küche ein (pt2)
    triggers:
      - trigger: device
        domain: mqtt
        device_id: 537c1f38a46cecfee54500d2db1e5537
        type: action
        subtype: "on"
    conditions:
      - alias: Licht ist bereits an
        condition: state
        entity_id: light.vorbau_hoflicht
        state: "on"
    actions:
      - action: light.turn_on
        target:
          entity_id:
            - light.pferdestall_hoflicht
            - light.scheune_hoflicht

  - alias: Reaktion auf IKEA Minitaster Küche ein (pt3)
    triggers:
      - trigger: device
        domain: mqtt
        device_id: 537c1f38a46cecfee54500d2db1e5537
        type: action
        subtype: "on"
    conditions:
      - alias: Licht (pt2) ist bereits an
        condition: state
        entity_id: light.pferdestall_hoflicht
        state: "on"
    actions:
      - action: button.press
        target:
          entity_id: button.irene_hoflicht_ausloser

  - alias: Reaktion auf IKEA Minitaster Küche ein lange
    triggers:
      - trigger: device
        domain: mqtt
        device_id: 537c1f38a46cecfee54500d2db1e5537
        type: action
        subtype: brightness_move_up
    actions:
      - action: light.turn_on
        target:
          entity_id:
            - light.vorbau_hoflicht
            - light.pferdestall_hoflicht
            - light.scheune_hoflicht

  - alias: Reaktion auf IKEA Minitaster Küche aus
    triggers:
      - trigger: device
        domain: mqtt
        device_id: 537c1f38a46cecfee54500d2db1e5537
        type: action
        subtype: "off"
      - trigger: device
        domain: mqtt
        device_id: 537c1f38a46cecfee54500d2db1e5537
        type: action
        subtype: brightness_move_down
    actions:
      - action: light.turn_off
        target:
          entity_id:
            - light.scheune_hoflicht
            - light.pferdestall_hoflicht
            - light.vorbau_hoflicht

  ##############################################################################
  # Ikea Shortcut Taster am Hoftor
  - alias: Reaktion auf IKEA Shortcut Taster Hoftor An
    triggers:
      - trigger: state
        entity_id: event.hof_hoftor_taster_action
        not_to:
          - "unknown"
          - "unavailable"
    conditions:
      - alias: Vorbau Licht ist aktuell aus
        condition: state
        entity_id: light.vorbau_hoflicht
        state: "off"
    actions:
      - action: light.turn_on
        target:
          entity_id:
            - light.vorbau_hoflicht
            - light.pferdestall_hoflicht
            - light.scheune_hoflicht

  - alias: Reaktion auf IKEA Shortcut Taster Hoftor Aus
    triggers:
      - trigger: state
        entity_id: event.hof_hoftor_taster_action
        not_to:
          - "unknown"
          - "unavailable"
    conditions:
      - alias: Vorbau Licht ist aktuell an
        condition: state
        entity_id: light.vorbau_hoflicht
        state: "on"
    actions:
      - action: light.turn_off
        target:
          entity_id:
            - light.scheune_hoflicht
            - light.pferdestall_hoflicht
            - light.vorbau_hoflicht
