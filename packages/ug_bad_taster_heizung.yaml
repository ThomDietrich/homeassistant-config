automation:
  ##############################################################################
  # Ikea I/O Taster im Badezimmer oben
  - alias: Heißes Duschwasser und Zirkulation mit IKEA I/O Taster im Bad
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: event.ug_bad_taster_eingang_action
        not_to:
          - "unknown"
          - "unavailable"
    actions:
      - action: esphome.keller_zh_regelung_warmwasser_anfordern
        data:
          zieltemperatur: >
            {{ states('input_number.keller_zh_warmwasser_temperatur_sollwert_manuell') | float(50) }}
      - action: switch.turn_on
        target:
          entity_id: switch.keller_zh_warmwasserspeicher_zirkulationspumpe
      - action: esphome.haus_uv_astra_play_rtttl
        data:
          song_str: "ack:d=8,o=6,b=100:8f,16g"
      - delay: "0:10:00"
      - action: switch.turn_off
        target:
          entity_id: switch.keller_zh_warmwasserspeicher_zirkulationspumpe
