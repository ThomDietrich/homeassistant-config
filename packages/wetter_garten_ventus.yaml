# Garten Ventus W830 — HA-seitige Zusatz-Sensoren (neuer Feed, Extension weewx_ha).
#
# Rollierende Regenwerte (Stunde/24h), letzter Schauer inkl. Start/Ende/Dauer,
# Tages-ET und Tages-Temperatur-Extremwerte werden inzwischen direkt in WeeWX aus
# der Archiv-DB berechnet und via MQTT-Discovery publiziert (Extension >= 1.3.0).
# Die frueheren HA-Helfer (utility_meter/statistics/template) sind damit ueberfluessig.
#
# Hier verbleiben nur zwei HA-seitige Ableitungen:
#   - Verbindungsindikator aus dem Availability-Topic der Extension.
#   - Trockenperiode: Zeit seit Ende des letzten Regenereignisses (aus eventRainEnd).

mqtt:
  binary_sensor:
    # Verbindungsindikator aus dem Availability-Topic der Extension (LWT online/offline).
    - name: "Garten Ventus W830 Verbindung"
      unique_id: garten_ventus_w830_verbindung
      state_topic: "weewx_ventus/status"
      payload_on: "online"
      payload_off: "offline"
      device_class: connectivity

template:
  # Trockenperiode: Tage seit Ende des letzten Regenereignisses (eventRainEnd).
  # Zeitgesteuert (alle 15 min) neu berechnet, da sich der Bezug now() sonst nicht
  # aktualisiert. Fuer Bewaesserungslogik (Smart Irrigation / Irrigation Unlimited).
  - triggers:
      - trigger: time_pattern
        minutes: "/15"
      - trigger: state
        entity_id: sensor.garten_ventus_w830_regen_schauerende
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Garten Ventus W830 Trockenperiode"
        unique_id: garten_ventus_w830_trockenperiode
        device_class: duration
        unit_of_measurement: "d"
        state_class: measurement
        availability: >
          {{ has_value('sensor.garten_ventus_w830_regen_schauerende') }}
        state: >
          {{ ((now() - states('sensor.garten_ventus_w830_regen_schauerende') | as_datetime).total_seconds() / 86400) | round(1) }}
