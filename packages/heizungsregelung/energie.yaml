sensor:
  - platform: derivative
    name: Keller ZH Heizkreis Volumenstrom ZWISCHENSCHRITT
    source: sensor.keller_zh_heizkreis_waermezaehler_volumen
    unit_time: min
    time_window:
      seconds: 30
    round: 1

  - platform: derivative
    name: Keller ZH Heizkreis Leistung ZWISCHENSCHRITT
    source: sensor.keller_zh_heizkreis_waermezaehler_energie
    unit_time: h
    unit: kW
    time_window:
      seconds: 60
    round: 2

  - platform: derivative
    name: Keller ZH Warmwasser Volumenstrom ZWISCHENSCHRITT
    source: sensor.keller_zh_warmwasserspeicher_waermezaehler_volumen
    unit_time: min
    time_window:
      seconds: 30
    round: 1

  - platform: derivative
    name: Keller ZH Warmwasser Leistung ZWISCHENSCHRITT
    source: sensor.keller_zh_warmwasserspeicher_waermezaehler_energie
    unit_time: h
    unit: kW
    time_window:
      seconds: 60
    round: 2

template:
  - sensor:
      - name: Keller ZH Heizkreis Volumenstrom
        unique_id: uniqueid__keller_zh_heizkreis_volumenstrom_l_min
        unit_of_measurement: "L/min"
        icon: mdi:waves-arrow-right
        state_class: measurement
        device_class: volume_flow_rate
        state: >
          {{ states('sensor.keller_zh_heizkreis_volumenstrom_zwischenschritt') | float(0) if is_state('binary_sensor.keller_zh_heizkreis_flusserkennung', 'on') else 0.0 }}
        availability: >
          {{ states('sensor.keller_zh_heizkreis_volumenstrom_zwischenschritt') not in [ 'unavailable', 'none', 'unknown' ] }}

      - name: Keller ZH Heizkreis Leistung
        unique_id: uniqueid__keller_zh_heizkreis_leistung
        unit_of_measurement: kW
        state_class: measurement
        device_class: power
        state: >
          {{ states('sensor.keller_zh_heizkreis_leistung_zwischenschritt') | float(0) if is_state('binary_sensor.keller_zh_heizkreis_flusserkennung', 'on') else 0.0 }}
        availability: >
          {{ states('sensor.keller_zh_heizkreis_leistung_zwischenschritt') not in [ 'unavailable', 'none', 'unknown' ] }}

      - name: Keller ZH Warmwasser Volumenstrom
        unique_id: uniqueid__keller_zh_warmwasser_volumenstrom_l_min
        unit_of_measurement: "L/min"
        icon: mdi:waves-arrow-right
        state_class: measurement
        device_class: volume_flow_rate
        state: >
          {{ states('sensor.keller_zh_warmwasser_volumenstrom_zwischenschritt') | float(0) if is_state('binary_sensor.keller_zh_warmwasserspeicher_flusserkennung', 'on') else 0.0 }}
        availability: >
          {{ states('sensor.keller_zh_warmwasser_volumenstrom_zwischenschritt') not in [ 'unavailable', 'none', 'unknown' ] }}

      - name: Keller ZH Warmwasser Leistung
        unique_id: uniqueid__keller_zh_warmwasser_leistung
        unit_of_measurement: kW
        state_class: measurement
        device_class: power
        state: >
          {{ states('sensor.keller_zh_warmwasser_leistung_zwischenschritt') | float(0) if is_state('binary_sensor.keller_zh_warmwasserspeicher_flusserkennung', 'on') else 0.0 }}
        availability: >
          {{ states('sensor.keller_zh_warmwasser_leistung_zwischenschritt') not in [ 'unavailable', 'none', 'unknown' ] }}
