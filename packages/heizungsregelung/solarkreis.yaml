input_boolean:
  keller_zh_solarkreis_automation:
    name: Keller ZH Solarkreis Automatisierung
    icon: mdi:robot-industrial

input_number:
  keller_zh_solarkreispumpe_diff_ein:
    name: Keller ZH Solarkreispumpe an (Temperaturdifferenz)
    unit_of_measurement: "°C"
    icon: mdi:thermometer
    min: 1
    max: 30
    step: 1
    initial: 22
    mode: box

  keller_zh_solarkreispumpe_diff_aus:
    name: Keller ZH Solarkreispumpe aus (Temperaturdifferenz)
    unit_of_measurement: "°C"
    icon: mdi:thermometer
    min: 0
    max: 30
    step: 1
    initial: 5
    mode: box

  keller_zh_solarkreis_speichertemp_max:
    name: Keller ZH Solarkreis Maximale Speichertemperatur
    unit_of_measurement: "°C"
    icon: mdi:thermometer-alert
    min: 20
    max: 90
    step: 1
    initial: 80
    mode: box

  keller_zh_solarkreis_kollektortemp_max:
    name: Keller ZH Solarkreis Maximale Kollektortemperatur
    unit_of_measurement: "°C"
    icon: mdi:thermometer-alert
    min: 100
    max: 130
    step: 1
    initial: 120
    mode: box

##############################################################################
automation:
  ##############################################################################
  # Solarkreis aus

  - alias: Keller ZH Solarkreis aus (Hysterese)
    trigger:
      - trigger: numeric_state
        entity_id: sensor.keller_zh_solarthermie_einschaltdifferenz
        below: input_number.keller_zh_solarkreispumpe_diff_aus
      - trigger: numeric_state
        entity_id: sensor.keller_zh_solarthermie_einschaltdifferenz
        below: -3 # failsafe
    conditions:
      - condition: state
        entity_id: input_boolean.keller_zh_solarkreis_automation
        state: "on"
      - condition: state
        entity_id: switch.keller_zh_solarthermie_umwaelzpumpe
        state: "on"
    actions:
      - action: switch.turn_off
        entity_id: switch.keller_zh_solarthermie_umwaelzpumpe

  - alias: Keller ZH Solarkreis aus (Maximale Speichertemperatur)
    triggers:
      - trigger: numeric_state
        entity_id: sensor.keller_zh_warmwasserspeicher_temperatur_unten
        above: input_number.keller_zh_solarkreis_speichertemp_max
    conditions:
      - condition: state
        entity_id: input_boolean.keller_zh_solarkreis_automation
        state: "on"
      - condition: state
        entity_id: switch.keller_zh_solarthermie_umwaelzpumpe
        state: "on"
    actions:
      - action: switch.turn_off
        entity_id: switch.keller_zh_solarthermie_umwaelzpumpe
      - action: script.notify_alarm
        data:
          msg_title: "AWF1877 Solarkreis"
          msg_text: "Solarkreis aus, maximale Speichertemperatur erreicht"

  - alias: Keller ZH Solarkreis aus (Maximale Kollektortemperatur)
    triggers:
      - trigger: numeric_state
        entity_id: sensor.keller_zh_solarthermie_kollektortemperatur
        above: input_number.keller_zh_solarkreis_kollektortemp_max
    conditions:
      - condition: state
        entity_id: input_boolean.keller_zh_solarkreis_automation
        state: "on"
      - condition: state
        entity_id: switch.keller_zh_solarthermie_umwaelzpumpe
        state: "on"
    actions:
      - action: switch.turn_off
        entity_id: switch.keller_zh_solarthermie_umwaelzpumpe
      - action: script.notify_alarm
        data:
          msg_title: "AWF1877 Solarkreis"
          msg_text: "Solarkreis aus, maximale Kollektortemperatur erreicht"

  - alias: Keller ZH Solarkreis aus (keine Sensorwerte)
    triggers:
      - trigger: state
        entity_id: sensor.keller_zh_warmwasserspeicher_temperatur_unten
        to: "unknown"
        for:
          minutes: 5
      - trigger: state
        entity_id: sensor.keller_zh_solarthermie_kollektortemperatur
        to: "unknown"
        for:
          minutes: 5
    conditions:
      - condition: state
        entity_id: input_boolean.keller_zh_solarkreis_automation
        state: "on"
      - condition: state
        entity_id: switch.keller_zh_solarthermie_umwaelzpumpe
        state: "on"
    actions:
      - action: switch.turn_off
        entity_id: switch.keller_zh_solarthermie_umwaelzpumpe
      - action: script.notify_alarm
        data:
          msg_title: "AWF1877 Solarkreis"
          msg_text: "Solarkreis aus, kein Sensorwert"

  ##############################################################################
  # Solarkreis ein

  - alias: Keller ZH Solarkreis ein (Hysterese plus Bedingungen)
    triggers:
      - trigger: state
        entity_id: sensor.keller_zh_solarthermie_einschaltdifferenz
    conditions:
      - alias: "Automation aktiv"
        condition: state
        entity_id: input_boolean.keller_zh_solarkreis_automation
        state: "on"
      - alias: "Solarkreispumpe aus"
        condition: state
        entity_id: switch.keller_zh_solarthermie_umwaelzpumpe
        state: "off"
      - alias: "Temperaturdifferenz Hysteresewert überschritten"
        condition: numeric_state
        entity_id: sensor.keller_zh_solarthermie_einschaltdifferenz
        above: input_number.keller_zh_solarkreispumpe_diff_ein
      - alias: "Maximale Speichertemperatur nicht erreicht"
        condition: numeric_state
        entity_id: sensor.keller_zh_warmwasserspeicher_temperatur_unten
        below: input_number.keller_zh_solarkreis_speichertemp_max
      - alias: "Maximale Kollektortemperatur nicht erreicht"
        condition: numeric_state
        entity_id: sensor.keller_zh_solarthermie_kollektortemperatur
        below: input_number.keller_zh_solarkreis_kollektortemp_max
    actions:
      - action: switch.turn_on
        entity_id: switch.keller_zh_solarthermie_umwaelzpumpe

  ##############################################################################

  - alias: Keller ZH Solarkreis Sensoralarm
    triggers:
      - trigger: numeric_state
        entity_id: sensor.keller_zh_solarthermie_kollektortemperatur
        above: input_number.keller_zh_solarkreis_kollektortemp_max
        for:
          minutes: 10
      - trigger: numeric_state
        entity_id: sensor.keller_zh_warmwasserspeicher_temperatur_unten
        above: input_number.keller_zh_solarkreis_speichertemp_max
        for:
          minutes: 10
    actions:
      - action: script.notify_alarm
        data:
          msg_title: "AWF1877 Solarkreis"
          msg_text: "Problem mit Solarkreis: '{{ trigger.entity_id }}'={{ trigger.to_state.state }}. Bitte prüfen."
