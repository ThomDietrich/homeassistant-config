input_boolean:
  keller_zh_heizung_automation:
    name: Keller ZH Heizung Automatisierung
    icon: mdi:robot-industrial

input_datetime:
  keller_zh_heizung_absenkung_nacht_ende:
    name: Keller ZH Heizung Nachtabsenkung Ende
    has_date: false
    has_time: true
    initial: "09:00"
  keller_zh_heizung_absenkung_tag_start:
    name: Keller ZH Heizung Tagesabsenkung Start
    has_date: false
    has_time: true
    initial: "11:00"
  keller_zh_heizung_absenkung_tag_ende:
    name: Keller ZH Heizung Tagesabsenkung Ende
    has_date: false
    has_time: true
    initial: "17:00"
  keller_zh_heizung_absenkung_nacht_start:
    name: Keller ZH Heizung Nachtabsenkung Start
    has_date: false
    has_time: true
    initial: "23:00"

input_number:
  keller_zh_heizung_absenkung_tag:
    name: Keller ZH Heizung Absenkung Tag
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-down
    min: 0
    max: 15
    step: 0.5
    initial: 15
    mode: box

  keller_zh_heizung_absenkung_nacht:
    name: Keller ZH Heizung Absenkung Nacht
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-down
    min: 0
    max: 25
    step: 0.5
    initial: 17
    mode: box

  keller_zh_heizung_heizkennlinie_offset:
    name: Keller ZH Heizung Heizkennlinie Parallelverschiebung
    unit_of_measurement: "°C"
    icon: mdi:thermometer-plus
    min: 0
    max: 35
    step: 0.1
    initial: 5.5
    mode: box

################################################################################

sensor:
  - platform: statistics
    name: Keller ZH Heizkreis Volumenstrom Mittelwert
    unique_id: unique_id__keller_zh_heizkreis_volumenstrom_mittelwert
    entity_id: sensor.keller_zh_heizkreis_volumenstrom
    state_characteristic: mean
    max_age:
      minutes: 10
    precision: 1

################################################################################

template:
  - sensor:
      - name: Keller ZH Heizkreis Volumenstrom Heizkennlinie Korrektur
        unique_id: unique_id__keller_zh_heizkreis_volumenstrom_heizkennlinie_korrektur
        unit_of_measurement: "K"
        icon: mdi:thermometer-plus
        # state_class: measurement
        state: >
          {% set v = states('sensor.keller_zh_heizkreis_volumenstrom_mittelwert') | float(0) %}
          {% set v1 = 0 %}
          {% set k1 = -6 %}
          {% set v2 = 12 %}
          {% set k2 = +12 %}
          {% set m = (k2 - k1) / (v2 - v1) %}
          {% set n = k1 - m * v1 %}
          {{ (m * v + n) | round(1) }}
        availability: >
          {{ has_value('sensor.keller_zh_heizkreis_volumenstrom_mittelwert') }}

      - name: Keller ZH Heizung Heizkennlinie theoretisch
        unique_id: unique_id__keller_zh_heizung_heizkennlinie_theoretisch
        unit_of_measurement: "°C"
        # state_class: measurement
        state: >
          {% if has_value('sensor.weather_station_windchill_c') %}
            {% set x = states('sensor.weather_station_windchill_c') | float(0) %}
          {% else %}
            {% set x = states('sensor.pferdestall_temperature') | float(0) %}
          {% endif %}
          {{ (-0.0002 * x**3 - 0.0045 * x**2 - 0.9782 * x + 44.141) | round(1) }}
        availability: >
          {{ has_value('sensor.weather_station_windchill_c') or has_value('sensor.pferdestall_temperature') }}

  - trigger:
      - trigger: state
        entity_id:
          - sensor.weather_station_windchill_c
          - sensor.pferdestall_temperature
          - input_boolean.keller_zh_heizung_automation
          - input_number.keller_zh_heizung_heizkennlinie_offset
          - input_number.keller_zh_heizung_absenkung_tag
          - input_number.keller_zh_heizung_absenkung_nacht
    sensor:
      - name: Keller ZH Heizung Heizkennlinie Sollwert
        unique_id: unique_id__keller_zh_heizung_heizkennlinie_sollwert
        unit_of_measurement: "°C"
        # state_class: measurement
        state: >
          {% set t = states('sensor.keller_zh_heizung_heizkennlinie_theoretisch') | float(0) %}
          {% set offset = states('input_number.keller_zh_heizung_heizkennlinie_offset') | float(0) %}
          {##}
          {% set absenkung_tag = states('input_number.keller_zh_heizung_absenkung_tag') | float(0) %}
          {% set absenkung_nacht = states('input_number.keller_zh_heizung_absenkung_nacht') | float(0) %}
          {##}
          {% set absenkung_tag_start = today_at(states('input_datetime.keller_zh_heizung_absenkung_tag_start')) %}
          {% set absenkung_tag_ende = today_at(states('input_datetime.keller_zh_heizung_absenkung_tag_ende')) %}
          {% set absenkung_nacht_start = today_at(states('input_datetime.keller_zh_heizung_absenkung_nacht_start')) %}
          {% set absenkung_nacht_ende = today_at(states('input_datetime.keller_zh_heizung_absenkung_nacht_ende')) %}
          {##}

          {% set volumenstrom_korrektur = states('sensor.keller_zh_heizkreis_volumenstrom_heizkennlinie_korrektur') | float(0) %}
          {##}
          {% if now() < absenkung_nacht_ende or now() > absenkung_nacht_start %}
            {{ (t + offset - absenkung_nacht) | round(1) }}
          {% elif now() > absenkung_tag_start and now() < absenkung_tag_ende %}
            {{ (t + offset - absenkung_tag + volumenstrom_korrektur) | round(1) }}
          {% else %}
            {{ (t + offset + volumenstrom_korrektur) | round(1) }}
          {% endif %}
        availability: >
          {{ has_value('sensor.keller_zh_heizung_heizkennlinie_theoretisch') }}

################################################################################

automation:
  - alias: Keller ZH Heizung folgt Heizkennlinie
    mode: restart
    max_exceeded: silent
    trigger:
      - trigger: state
        entity_id: sensor.keller_zh_heizung_heizkennlinie_sollwert
      - trigger: state
        entity_id: input_boolean.keller_zh_heizung_automation
        to: "on"
      - alias: "ESP Neustart"
        trigger: state
        entity_id: binary_sensor.keller_zh_regelung_esp_device_status
        to: "on"
      - alias: "HA Neustart"
        trigger: homeassistant
        event: start
    condition:
      - alias: "Automation aktiv"
        condition: state
        entity_id: input_boolean.keller_zh_heizung_automation
        state: "on"
    action:
      - action: esphome.keller_zh_regelung_heizung_anfordern
        data:
          sollwert: "{{ states('sensor.keller_zh_heizung_heizkennlinie_sollwert') | float(0) }}"

  - alias: Keller ZH Heizung deaktiviert
    trigger:
      - trigger: state
        entity_id: input_boolean.keller_zh_heizung_automation
        to: "off"
    action:
      - action: esphome.keller_zh_regelung_heizung_anfordern
        data:
          sollwert: 0

  - alias: Keller ZH Heizung folgt Heizkennlinie (Fehlerfall)
    mode: restart
    max_exceeded: silent
    trigger:
      - trigger: state
        entity_id: sensor.keller_zh_heizung_heizkennlinie_sollwert
        to:
          - "unknown"
          - "unavailable"
        for:
          minutes: 15
    condition:
      - alias: "Automation aktiv"
        condition: state
        entity_id: input_boolean.keller_zh_heizung_automation
        state: "on"
    action:
      - action: esphome.keller_zh_regelung_heizung_anfordern
        data:
          sollwert: 45
      - action: script.notify_warnung
        data:
          msg_title: "AWF1877 Keller ZH"
          msg_text: "Heizkennlinie kann nicht berechnet werden. Gastherme auf feste 45°C Sollwert eingestellt."
