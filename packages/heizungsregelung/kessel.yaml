input_boolean:
  flag_keller_zh_kessel_pumpe_ruhefahrt_aktiv:
    name: Flag Keller ZH Festbrennstoffkessel Kesselkreispumpe aktiv aufgrund von Inaktivität
    icon: mdi:robot-industrial

input_number:
  keller_zh_kessel_pumpe_temperatur_ein:
    name: Keller ZH Festbrennstoffkessel Kesselkreispumpe Temperatur Einschaltung
    unit_of_measurement: "°C"
    icon: mdi:thermometer-auto
    min: 15
    max: 100
    step: 1
    initial: 45
    mode: box
  keller_zh_kessel_pumpe_temperatur_aus:
    name: Keller ZH Festbrennstoffkessel Kesselkreispumpe Temperatur Ausschaltung
    unit_of_measurement: "°C"
    icon: mdi:thermometer-auto
    min: 15
    max: 100
    step: 1
    initial: 40
    mode: box
  keller_zh_kessel_pumpe_temperatur_notify:
    name: Keller ZH Festbrennstoffkessel Kesselkreispumpe Temperatur Benachrichtigung
    unit_of_measurement: "°C"
    icon: mdi:thermometer-lines
    min: 15
    max: 100
    step: 1
    initial: 85
    mode: box

template:
  - binary_sensor:
      - name: Keller ZH Kessel aktiv
        unique_id: unique_id__keller_zh_kessel_aktiv
        state: >
          {{ states('sensor.keller_zh_kessel_abgastemperatur') | float(0) > 40 }}
        availability: >
          {{ states('sensor.keller_zh_kessel_abgastemperatur') not in [ 'unavailable', 'none', 'unknown' ] }}

sensor:
  - platform: statistics
    name: Keller ZH Kessel Abgas Aenderung 10min
    unique_id: unique_id__keller_zh_kessel_abgas_change
    entity_id: sensor.keller_zh_kessel_abgastemperatur
    state_characteristic: change
    max_age:
      minutes: 10
    precision: 1

automation:
  ##############################################################################

  - alias: Keller ZH Festbrennstoffkessel Kesselkreispumpe ein (Hysterese)
    triggers:
      - trigger: numeric_state
        entity_id: sensor.keller_zh_kessel_abgastemperatur
        above: input_number.keller_zh_kessel_pumpe_temperatur_ein
    actions:
      - action: input_boolean.turn_off
        entity_id: input_boolean.flag_keller_zh_kessel_pumpe_ruhefahrt_aktiv
      - action: switch.turn_on
        entity_id: switch.keller_zh_kessel_pufferkreis_umwaelzpumpe

  - alias: Keller ZH Festbrennstoffkessel Kesselkreispumpe ein (hohe Temperatur)
    triggers:
      - trigger: numeric_state
        entity_id: sensor.keller_zh_kessel_abgastemperatur
        above: 100
      - trigger: numeric_state
        entity_id: sensor.keller_zh_kessel_abgastemperatur
        above: 150
    conditions:
      - condition: state
        entity_id: switch.keller_zh_kessel_pufferkreis_umwaelzpumpe
        state: "off"
    actions:
      - action: input_boolean.turn_off
        entity_id: input_boolean.flag_keller_zh_kessel_pumpe_ruhefahrt_aktiv
      - action: switch.turn_on
        entity_id: switch.keller_zh_kessel_pufferkreis_umwaelzpumpe
      - action: script.notify_info
        data:
          msg_title: "AWF1877 Keller ZH"
          msg_text: "Festbrennstoffkessel Kesselkreispumpe außerplanmäßig ein bei hoher Temperatur"

  - alias: Keller ZH Festbrennstoffkessel Kesselkreispumpe ein (kein Sensorwert)
    triggers:
      - trigger: state
        entity_id: sensor.keller_zh_kessel_abgastemperatur
        to:
          - "unknown"
          - "unavailable"
        for:
          minutes: 10
    conditions:
      - condition: state
        entity_id: switch.keller_zh_kessel_pufferkreis_umwaelzpumpe
        state: "off"
    actions:
      - action: input_boolean.turn_off
        entity_id: input_boolean.flag_keller_zh_kessel_pumpe_ruhefahrt_aktiv
      - action: switch.turn_on
        entity_id: switch.keller_zh_kessel_pufferkreis_umwaelzpumpe
      - action: script.notify_info
        data:
          msg_title: "AWF1877 Keller ZH"
          msg_text: "Festbrennstoffkessel Kesselkreispumpe außerplanmäßig ein bei fehlendem Sensorwert"

  ##############################################################################

  - alias: Keller ZH Festbrennstoffkessel Kesselkreispumpe ein (24h Inaktivität)
    triggers:
      - trigger: state
        entity_id: switch.keller_zh_kessel_pufferkreis_umwaelzpumpe
        to: "off"
        for:
          hours: 24
    actions:
      - action: input_boolean.turn_on
        entity_id: input_boolean.flag_keller_zh_kessel_pumpe_ruhefahrt_aktiv
      - action: switch.turn_on
        entity_id: switch.keller_zh_kessel_pufferkreis_umwaelzpumpe
      - action: script.notify_info
        data:
          msg_title: "AWF1877 Keller ZH"
          msg_text: "Festbrennstoffkessel Kesselkreispumpe eingeschaltet nach 24h Inaktivität"

  - alias: Keller ZH Festbrennstoffkessel Kesselkreispumpe aus (24h Inaktivität)
    triggers:
      - trigger: state
        entity_id: switch.keller_zh_kessel_pufferkreis_umwaelzpumpe
        to: "on"
        for:
          minutes: 1
    conditions:
      - condition: state
        entity_id: input_boolean.flag_keller_zh_kessel_pumpe_ruhefahrt_aktiv
        state: "on"
    actions:
      - action: input_boolean.turn_off
        entity_id: input_boolean.flag_keller_zh_kessel_pumpe_ruhefahrt_aktiv
      - action: switch.turn_off
        entity_id: switch.keller_zh_kessel_pufferkreis_umwaelzpumpe
      - action: script.notify_info
        data:
          msg_title: "AWF1877 Keller ZH"
          msg_text: "Festbrennstoffkessel Kesselkreispumpe ausgeschaltet nach 24h Inaktivität"

  ##############################################################################

  - alias: Keller ZH Festbrennstoffkessel Kesselkreispumpe aus (Hysterese)
    triggers:
      - trigger: numeric_state
        entity_id: sensor.keller_zh_kessel_abgastemperatur
        below: input_number.keller_zh_kessel_pumpe_temperatur_aus
    conditions:
      - condition: state
        entity_id: switch.keller_zh_kessel_pufferkreis_umwaelzpumpe
        state: "on"
    actions:
      - action: switch.turn_off
        entity_id: switch.keller_zh_kessel_pufferkreis_umwaelzpumpe

  ##############################################################################

  - alias: Keller ZH Festbrennstoffkessel Benachrichtigung zum Nachfeuern
    triggers:
      - trigger: numeric_state
        entity_id: sensor.keller_zh_kessel_abgastemperatur
        below: input_number.keller_zh_kessel_pumpe_temperatur_notify
    conditions:
      - condition: time
        after: "10:00:00"
        before: "22:00:00"
      - condition: numeric_state
        entity_id: sensor.keller_zh_kessel_pufferkreis_ruecklauftemperatur
        below: 65
      - condition: template
        value_template: "{{ is_number(trigger.from_state.state) and is_number(trigger.to_state.state) }}"
    actions:
      - action: notify.werner
        data:
          title: "AWF1877 Keller ZH"
          message: "Bitte Holz im Festbrennstoffkessel nachlegen!"
          data:
            channel: Aktion erforderlich
            color: "#FC9E4F"
            vibrationPattern: "100, 1000, 100, 1000, 100"
            #sticky: true
            #persistent: true
            tag: "holzkessel_nachlegen"
      - action: persistent_notification.create
        data:
          title: "AWF1877 Keller ZH"
          message: "Bitte Holz im Festbrennstoffkessel nachlegen!"
          notification_id: "pn_holzkessel_nachlegen"

  - alias: Keller ZH Festbrennstoffkessel Benachrichtigung zum Nachfeuern löschen
    triggers:
      - trigger: numeric_state
        entity_id: sensor.keller_zh_kessel_abgastemperatur
        above: input_number.keller_zh_kessel_pumpe_temperatur_notify
      - trigger: numeric_state
        entity_id: sensor.keller_zh_kessel_abgastemperatur
        below: 35
    actions:
      - action: notify.werner
        data:
          title: "AWF1877 Keller ZH"
          message: "clear_notification" # special action
          data:
            tag: "holzkessel_nachlegen"
      - action: persistent_notification.dismiss
        data:
          notification_id: "pn_holzkessel_nachlegen"

  - alias: Keller ZH Festbrennstoffkessel Benachrichtigung Temperatur erreicht
    triggers:
      - trigger: numeric_state
        entity_id: sensor.pufferspeicher_durchwarmung
        above: 95
    actions:
      - action: script.notify_info
        data:
          msg_title: "AWF1877 Keller ZH"
          msg_text: "Pufferspeicher blau durchgeheizt"

  - alias: Keller ZH Festbrennstoffkessel Benachrichtigung Temperatur erreicht
    triggers:
      - trigger: numeric_state
        entity_id: sensor.keller_zh_kessel_pufferkreis_ruecklauftemperatur
        above: 70
        for:
          minutes: 5
    actions:
      - action: notify.werner
        data:
          title: "AWF1877 Keller ZH"
          message: "clear_notification" # special action
          data:
            tag: "holzkessel_nachlegen"
      - action: persistent_notification.dismiss
        data:
          notification_id: "pn_holzkessel_nachlegen"
      - action: script.notify_info
        data:
          msg_title: "AWF1877 Keller ZH"
          msg_text: "Pufferspeicher durchgeheizt. Bitte Heizung drosseln"

  ##############################################################################

  - alias: Keller ZH Festbrennstoffkessel Abgas Warnung
    triggers:
      - trigger: numeric_state
        entity_id: sensor.keller_zh_kessel_abgastemperatur
        above: 370
        for:
          minutes: 5
      - trigger: numeric_state
        entity_id: sensor.keller_zh_kessel_ruecklauftemperatur
        above: 75
        for:
          minutes: 5
    actions:
      - action: script.notify_warnung
        data:
          msg_title: "AWF1877 Keller ZH Warnung"
          msg_text: "Problem mit Festbrennstoffkessel: '{{ trigger.entity_id }}'={{ trigger.to_state.state }}. Bitte prüfen."

  - alias: Keller ZH Festbrennstoffkesselpufferkreis Warnung
    triggers:
      - trigger: numeric_state
        entity_id: sensor.keller_zh_kessel_pufferkreis_ruecklauftemperatur
        above: 45
        for:
          minutes: 3
    actions:
      - action: script.notify_warnung
        data:
          msg_title: "AWF1877 Keller ZH Warnung"
          msg_text: "Festbrennstoffkessel Pufferkreis Rücklauf zu hoch! Vermutlich durchgeheizt. Bitte prüfen. '{{ trigger.entity_id }}'={{ trigger.to_state.state }}"

  - alias: Keller ZH Festbrennstoffkesselpufferkreis Alarm
    triggers:
      - trigger: numeric_state
        entity_id: sensor.keller_zh_kessel_vorlauftemperatur
        above: 85
        for:
          minutes: 3
      - trigger: numeric_state
        entity_id: sensor.keller_zh_kessel_pufferkreis_ruecklauftemperatur
        above: 55
        for:
          minutes: 3
    actions:
      - action: script.notify_alarm
        data:
          msg_title: "AWF1877 Keller ZH Alarm"
          msg_text: "Festbrennstoffkessel Vorlauf / Pufferkreis Rücklauf zu hoch! Bitte prüfen. '{{ trigger.entity_id }}'={{ trigger.to_state.state }}"
