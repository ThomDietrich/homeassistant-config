  #         percentage: "{{ trigger.to_state.state | int(0) }}"

  - alias: Heizungsregelung Gastherme Sollwert an ESP übergeben
    trigger:
      - alias: Regelmaessige Anpassung
        trigger: state
        entity_id: input_number.heizungsregelung_gastherme_sollwert_temperatur
      - alias: ESP Absturz oder Neustart
        trigger: state
        entity_id: binary_sensor.heizungsregelung_esp_device_status
        to: "on"
      - alias: HA Neustart
        trigger: homeassistant
        event: start
    action:
      - action: esphome.heizungsregelung_gastherme_solltemperatur_set
        data:
          temperature: "{{ states('input_number.heizungsregelung_gastherme_sollwert_temperatur') | float(0) }}"
