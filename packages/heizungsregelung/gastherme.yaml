  keller_zh_gastherme_sollwert_temperatur:
    name: Keller ZH Gastherme Sollwert (EM10 Vorlauf)
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-up
    min: 0
    max: 90
    step: 0.1
    initial: 39.8
    #mode: box

template:
  - sensor:
      - name: Keller ZH Gastherme Kreislauf
        unique_id: unique_id__keller_zh_gastherme_kreislauf
        state: >
          {{ states('select.keller_zh_gastherme_betriebsmodus') if has_value('select.keller_zh_gastherme_betriebsmodus') else 'unknown' }}
        availability: >
          {{ has_value('select.keller_zh_gastherme_betriebsmodus') }}

  - binary_sensor:
      - name: Keller ZH Gastherme Kreislauf Warmwasser
        unique_id: unique_id__keller_zh_gastherme_kreislauf_warmwasser
        state: >
          {{ is_state('select.keller_zh_gastherme_betriebsmodus', 'Warmwasser') }}
        availability: >
          {{ has_value('select.keller_zh_gastherme_betriebsmodus') }}

      - name: Keller ZH Gastherme Kreislauf Heizung
        unique_id: unique_id__keller_zh_gastherme_kreislauf_heizung
        state: >
          {{ is_state('select.keller_zh_gastherme_betriebsmodus', 'Heizen') }}
        availability: >
          {{ has_value('select.keller_zh_gastherme_betriebsmodus') }}

automation:
  ##############################################################################
  # EM10 Vorlauftemperatur °C --> 0..10V --> 0..100% --> ESP (esphome)

  # - alias: Keller ZH Gastherme Sollwert über EM10 Vorlauftemperatur
  #   trigger:
  #     - trigger: state
  #       entity_id: input_number.keller_zh_gastherme_sollwert_temperatur
  #   action:
  #     - action: input_number.set_value
  #       data:
  #         entity_id: input_number.keller_zh_gastherme_sollwert_volt
  #         value: "{{ max( [0, (trigger.to_state.state | float(0) * 0.1253 - 1.2751)] ) | float(0) | round(2) }}"

  # - alias: Keller ZH Gastherme Sollwert über Volt Schieberegler
  #   trigger:
  #     - trigger: state
  #       entity_id: input_number.keller_zh_gastherme_sollwert_volt
  #   action:
  #     - action: input_number.set_value
  #       data:
  #         entity_id: input_number.keller_zh_gastherme_sollwert_pwm_prozent
  #         value: "{{ max( [0, ((trigger.to_state.state | float(0) - 0.4535) * 10.05)] ) | int(0) }}"
  #         # todo limit to 0..10V

  # - alias: Keller ZH Gastherme Sollwert über Prozent Schieberegler
  #   trigger:
  #     - trigger: state
  #       entity_id: input_number.keller_zh_gastherme_sollwert_pwm_prozent
  #   action:
  #     - action: esphome.keller_zh_gastherme_sollwert_pwm_set
  #       data:
  #         percentage: "{{ trigger.to_state.state | int(0) }}"

  - alias: Keller ZH Gastherme Sollwert an ESP übergeben
    trigger:
      - alias: Regelmaessige Anpassung
        trigger: state
        entity_id: input_number.keller_zh_gastherme_sollwert_temperatur
      - alias: ESP Absturz oder Neustart
        trigger: state
        entity_id: binary_sensor.keller_zh_regelung_esp_device_status
        to: "on"
      - alias: HA Neustart
        trigger: homeassistant
        event: start
    action:
      - action: esphome.keller_zh_regelung_gastherme_solltemperatur_set
        data:
          temperature: "{{ states('input_number.keller_zh_gastherme_sollwert_temperatur') | float(0) }}"
