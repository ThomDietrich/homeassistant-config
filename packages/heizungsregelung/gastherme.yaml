  #   action:
  #     - action: input_number.set_value
  #       data:
  #         entity_id: input_number.heizungsregelung_gastherme_sollwert_volt
  #         value: "{{ max( [0, (trigger.to_state.state | float(0) * 0.1253 - 1.2751)] ) | float(0) | round(2) }}"

  # - alias: Heizungsregelung Gastherme Sollwert über Volt Schieberegler
  #   trigger:
  #     - trigger: state
  #       entity_id: input_number.heizungsregelung_gastherme_sollwert_volt
  #   action:
  #     - action: input_number.set_value
  #       data:
  #         entity_id: input_number.heizungsregelung_gastherme_sollwert_pwm_prozent
  #         value: "{{ max( [0, ((trigger.to_state.state | float(0) - 0.4535) * 10.05)] ) | int(0) }}"
  #         # todo limit to 0..10V

  # - alias: Heizungsregelung Gastherme Sollwert über Prozent Schieberegler
  #   trigger:
  #     - trigger: state
  #       entity_id: input_number.heizungsregelung_gastherme_sollwert_pwm_prozent
  #   action:
  #     - action: esphome.heizungsregelung_gastherme_sollwert_pwm_set
