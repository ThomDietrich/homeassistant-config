input_number:
  # heizungsregelung_gastherme_sollwert_pwm_prozent:
  #   name: Heizungsregelung Gastherme Sollwert (PWM level)
  #   unit_of_measurement: "%"
  #   icon: mdi:timelapse
  #   min: 0
  #   max: 100
  #   step: 1
  #   #initial: 30
  #   #mode: box

  # heizungsregelung_gastherme_sollwert_volt:
  #   name: Heizungsregelung Gastherme Sollwert (Spannung)
  #   unit_of_measurement: "V"
  #   icon: mdi:power-plug-outline
  #   min: 0
  #   max: 10
  #   step: 0.1
  #   #initial: 3
  #   #mode: box

  heizungsregelung_gastherme_sollwert_temperatur:
    name: Heizungsregelung Gastherme Sollwert (EM10 Vorlauf)
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-up
    min: 0
    max: 90
    step: 0.1
    #initial: 50
    #mode: box

template:
  - sensor:
      - name: Heizungsregelung Gastherme Sollwert Temperatur
        unique_id: uniqueid__heizungsregelung_gastherme_sollwert_temperatur
        unit_of_measurement: "°C"
        state_class: measurement
        device_class: temperature
        state: >
          {{ states('input_number.heizungsregelung_gastherme_sollwert_temperatur') | float(0) }}
        availability: >
          {{ states('input_number.heizungsregelung_gastherme_sollwert_temperatur') not in [ 'unavailable', 'none', 'unknown' ] }}

      - name: Heizungsregelung Gastherme Kreislauf
        unique_id: unique_id__heizungsregelung_gastherme_kreislauf
        state: >
          {{ 'Heizung' if is_state('switch.heizungsregelung_warmwasserbereitung_anforderung', 'off') else 'Warmwasser' }}
        availability: >
          {{ states('switch.heizungsregelung_warmwasserbereitung_anforderung') not in [ 'unavailable', 'none', 'unknown' ] }}

  - binary_sensor:
      - name: Heizungsregelung Gastherme Kreislauf Warmwasser
        unique_id: unique_id__heizungsregelung_gastherme_kreislauf_warmwasser
        state: >
          {{ is_state('switch.heizungsregelung_warmwasserbereitung_anforderung', 'on') }}
        availability: >
          {{ states('switch.heizungsregelung_warmwasserbereitung_anforderung') not in [ 'unavailable', 'none', 'unknown' ] }}

      - name: Heizungsregelung Gastherme Kreislauf Heizung
        unique_id: unique_id__heizungsregelung_gastherme_kreislauf_heizung
        state: >
          {{ is_state('switch.heizungsregelung_warmwasserbereitung_anforderung', 'off') }}
        availability: >
          {{ states('switch.heizungsregelung_warmwasserbereitung_anforderung') not in [ 'unavailable', 'none', 'unknown' ] }}

automation:
  ##############################################################################
  # EM10 Vorlauftemperatur °C --> 0..10V --> 0..100% --> ESP (esphome)

