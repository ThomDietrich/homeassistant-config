automation:
  - alias: Schalte beide UG Stube Lichter mit Wohnstube Taster
    triggers:
      - trigger: state
        entity_id: event.ug_wohnstube_licht_taster_ereignis
    conditions:
      - condition: state
        entity_id: event.ug_wohnstube_licht_taster_ereignis
        attribute: event_type
        state: button_pressed_long
    actions:
      - if:
          - condition: state
            entity_id: light.ug_wohnstube_licht_deckenlampe
            state: "off"
        then:
          - action: light.turn_off
            target:
              entity_id: light.ug_gute_stube_licht_deckenlampe
        else:
          - action: light.turn_on
            target:
              entity_id: light.ug_gute_stube_licht_deckenlampe

  - alias: Schalte beide UG Stube Lichter mit Gute Stube Taster
    triggers:
      - trigger: state
        entity_id: event.ug_gute_stube_licht_taster_ereignis
    conditions:
      - condition: state
        entity_id: event.ug_gute_stube_licht_taster_ereignis
        attribute: event_type
        state: button_pressed_long
    actions:
      - if:
          - condition: state
            entity_id: light.ug_gute_stube_licht_deckenlampe
            state: "off"
        then:
          - action: light.turn_off
            target:
              entity_id: light.ug_wohnstube_licht_deckenlampe
        else:
          - action: light.turn_on
            target:
              entity_id: light.ug_wohnstube_licht_deckenlampe
