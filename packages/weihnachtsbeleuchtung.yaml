automation:
  - alias: Weihnachtsbeleuchtung zum Kaffee ein
    triggers:
      - trigger: time
        at: "15:30:00"
    actions:
      - action: light.turn_on
        target:
          entity_id: light.hof_weihnachtskonifere

  - alias: Weihnachtsbeleuchtung zum Sonnenuntergang ein
    triggers:
      - trigger: sun
        event: sunset
        offset: "00:15:00"
    actions:
      - action: light.turn_on
        target:
          entity_id:
            - light.hof_weihnachtskutsche
            - light.halle_weihnachtsstern

  - alias: Weihnachtsbeleuchtung aus
    triggers:
      - trigger: time
        at: "22:00:00"
    actions:
      - action: light.turn_off
        target:
          entity_id:
            - light.hof_weihnachtskonifere
            - light.hof_weihnachtskutsche
            - light.halle_weihnachtsstern
