automation:
  - alias: Schalte Pumpe mit Taster 0 ein/aus
    trigger:
      - trigger: state
        entity_id: event.gartenbewaesserung_astra_taster
    condition:
      - condition: state
        entity_id: event.gartenbewaesserung_astra_taster
        attribute: event_type
        state: controller_button_pressed_event_0
    action:
      - if:
          - condition: state
            entity_id: switch.gartenbewaesserung_pumpe
            state: "off"
        then:
          - action: switch.turn_on
            entity_id: switch.gartenbewaesserung_pumpe
        else:
          - action: switch.turn_off
            entity_id: switch.gartenbewaesserung_pumpe

  - alias: Schalte Taster 0 LED mit Pumpe ein
    trigger:
      - trigger: state
        entity_id: switch.gartenbewaesserung_pumpe
        to: "on"
    action:
      - action: select.select_option
        entity_id: select.gartenbewaesserung_astra_taster_0_led
        data:
          option: green

  - alias: Schalte Taster 0 LED mit Pumpe aus
    trigger:
      - trigger: state
        entity_id: switch.gartenbewaesserung_pumpe
        to: "off"
    action:
      - action: select.select_option
        entity_id: select.gartenbewaesserung_astra_taster_0_led
        data:
          option: "off"
