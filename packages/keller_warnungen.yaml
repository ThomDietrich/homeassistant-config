automation:
  - alias: Regel Warnung bei Wasser im Keller
    description: Reaktion auf ein Signal des Wasserstands-Sensors im Keller
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.keller_bodenwasser_sensor_wasserwarnung
      - trigger: time_pattern
        # Trigger zur vollen Stunde
        hours: "*"
        minutes: "0"
    conditions:
      - condition: state
        entity_id: binary_sensor.keller_bodenwasser_sensor_wasserwarnung
        state: "on"
    actions:
      - repeat:
          sequence:
            - action: script.notify_alarm
              data:
                msg_title: AWF1877 Warnung
                msg_text: Wasser-Sensor im Keller wurde ausgelöst!
            - delay:
                minutes: 15
          until:
            condition: state
            entity_id: binary_sensor.keller_bodenwasser_sensor_wasserwarnung
            state: "off"

  - alias: Regel Warnung bei CO im Keller
    description: Reaktion auf ein Signal des Kohlenmonoxid Sensors
    triggers:
      - trigger: numeric_state
        entity_id: sensor.keller_kohlenmonoxid_melder_kohlenmonoxid
        above: 1
    actions:
      - repeat:
          sequence:
            - action: script.notify_alarm
              data:
                msg_title: AWF1877 Warnung
                msg_text: "Kohlenmonoxid Wert im Keller gemessen: {{ trigger.to_state.state }} ppm"
            - delay:
                minutes: 3
          until:
            condition: state
            entity_id: sensor.keller_kohlenmonoxid_melder_kohlenmonoxid
            state: "0"
