homeassistant:
  customize:
    sensor.bienenstockwaage_01_stats_aenderung_15min:
      friendly_name: "Bienenstockwaage 01 (Änderung 15min)"
    sensor.bienenstockwaage_02_stats_aenderung_15min:
      friendly_name: "Bienenstockwaage 02 (Änderung 15min)"
    sensor.bienenstockwaage_03_stats_aenderung_15min:
      friendly_name: "Bienenstockwaage 03 (Änderung 15min)"
    sensor.bienenstockwaage_04_stats_aenderung_15min:
      friendly_name: "Bienenstockwaage 04 (Änderung 15min)"
    sensor.bienenstockwaage_05_stats_aenderung_15min:
      friendly_name: "Bienenstockwaage 05 (Änderung 15min)"
    sensor.bienenstockwaage_06_stats_aenderung_15min:
      friendly_name: "Bienenstockwaage 06 (Änderung 15min)"
    sensor.bienenstockwaage_07_stats_aenderung_15min:
      friendly_name: "Bienenstockwaage 07 (Änderung 15min)"

#############################################################################

automation:
  - alias: Bienen starke Änderung
    triggers:
      - trigger: numeric_state
        entity_id: sensor.bienenstockwaage_01_stats_aenderung_15min
        below: -2.0
        for:
          seconds: 30
      - trigger: numeric_state
        entity_id: sensor.bienenstockwaage_02_stats_aenderung_15min
        below: -2.0
        for:
          seconds: 30
      - trigger: numeric_state
        entity_id: sensor.bienenstockwaage_03_stats_aenderung_15min
        below: -2.0
        for:
          seconds: 30
      - trigger: numeric_state
        entity_id: sensor.bienenstockwaage_04_stats_aenderung_15min
        below: -2.0
        for:
          seconds: 30
      - trigger: numeric_state
        entity_id: sensor.bienenstockwaage_05_stats_aenderung_15min
        below: -2.0
        for:
          seconds: 30
      - trigger: numeric_state
        entity_id: sensor.bienenstockwaage_06_stats_aenderung_15min
        below: -2.0
        for:
          seconds: 30
      - trigger: numeric_state
        entity_id: sensor.bienenstockwaage_07_stats_aenderung_15min
        below: -2.0
        for:
          seconds: 30
    conditions:
      - alias: "Werner nicht im Garten"
        condition: not
        conditions:
          - condition: state
            entity_id: device_tracker.wd_pixel_6a
            state: "Garten"
    actions:
      - action: script.notify_alarm
        data:
          msg_title: "AWF1877 Schwarmalarm"
          msg_text: "Ungewöhnliche Aktivität auf {{ trigger.to_state.attributes.friendly_name }}. Gewicht ist um {{ trigger.to_state.state }}kg gefallen"
