# Bienenstockwaagen (Hives 01–07)
#
# - Referenzgewichte für Zweizarger (Eingabe via UI)
# - Statistik-Sensoren je Waage:
#     * distanz_24h    -> Spreizung (max-min) der letzten 24 h
#     * aenderung_24h  -> Differenz erster→letzter Wert (24 h)
#     * aenderung_15min-> Differenz erster→letzter Wert (15 min, Schwarmalarm)
# - Schwarmalarm bei Gewichtssturz < -2 kg in 15 min, sofern Werner nicht im Garten

input_number:
  bienenstock_referenzgewicht_zweizargig_min:
    name: Bienenstock Referenzgewicht Zweizarger Minimum
    unit_of_measurement: "kg"
    icon: mdi:weight-kilogram
    min: 15
    max: 40
    step: 0.5
    mode: box
    # Richtwert: 19 kg (Bienenmasse + Brut + Leerwaben)

  bienenstock_referenzgewicht_zweizargig_inkl_winterfutter:
    name: Bienenstock Referenzgewicht Zweizarger inklusive Futtervorrat
    unit_of_measurement: "kg"
    icon: mdi:weight-kilogram
    min: 15
    max: 40
    step: 0.5
    mode: box
    # Richtwert: 36.5 kg (Mindestgewicht + ~17.5 kg Winterfutter)

################################################################################

sensor:
  # --- Bienenstockwaage 01 ---------------------------------------------------
  # Hinweis: kein sampling_size gesetzt -> Default-Verhalten (max_age allein reicht)
  - platform: statistics
    name: bienenstockwaage_01_stats_distanz_24h
    entity_id: sensor.bienenstockwaage_01_gewicht
    state_characteristic: distance_absolute
    max_age:
      hours: 24
  - platform: statistics
    name: bienenstockwaage_01_stats_aenderung_24h
    entity_id: sensor.bienenstockwaage_01_gewicht
    state_characteristic: change
    max_age:
      hours: 24
  - platform: statistics
    name: bienenstockwaage_01_stats_aenderung_15min
    entity_id: sensor.bienenstockwaage_01_gewicht
    state_characteristic: change
    max_age:
      minutes: 15

