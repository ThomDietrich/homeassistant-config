rest:
  - resource: !secret ipgeolocation_moon_api_url
    scan_interval: 1200
    sensor:
      - name: IPGeolocation Moon Astronomy API
        unique_id: rest_ipgeolocation_moon_astronomy
        value_template: "{{ value_json.moon_status }}"
        json_attributes:
          - date
          - current_time
          - moonrise
          - moonset
          - moon_status
          - moon_altitude
          - moon_distance
          - moon_azimuth
          - moon_parallactic_angle

sensor:
  # OpenWeatherMap (custom integration; platform form is required here)
  - platform: openweathermap_all
    api_key: !secret openweathermap_api_key
    latitude: !secret latitude
    longitude: !secret longitude

  # Statistics sensors over outdoor temperature
  - platform: statistics
    name: weather_station_outtemp_c_18h_min
    entity_id: sensor.weather_station_outtemp_c
    state_characteristic: value_min
    max_age:
      hours: 18
    sampling_size: 600
  - platform: statistics
    name: weather_station_outtemp_c_18h_max
    entity_id: sensor.weather_station_outtemp_c
    state_characteristic: value_max
    max_age:
      hours: 18
    sampling_size: 600
