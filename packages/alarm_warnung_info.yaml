input_boolean:
  system_meldung_warn:
    name: Systemweite Warnmeldung (Flur Buzzer)
    icon: mdi:alert-octagram-outline
    initial: false
  system_meldung_alarm:
    name: Systemweite Alarmmeldung (Flur Buzzer)
    icon: mdi:alert-octagram
    initial: false

################################################################################

script:
  notify_alarm:
    description: Sende eine Alarmmeldung (Persistent, Flur, Mobile)
    fields:
      msg_title:
        description: "Der Titel der schriftlichen Benachrichtigung"
        example: "AWF1877 Heizungsregelung Warnung"
      msg_text:
        description: "The message content"
        example: "Problem mit Heizung. Bitte prüfen."
    sequence:
      - action: input_boolean.turn_on
        entity_id: input_boolean.system_meldung_alarm
      - action: notify.werner_thomas_plus
        data:
          title: "{{ msg_title }}"
          message: "{{ msg_text }}"
          data:
            channel: Alarmmeldung
            importance: high
            priority: high
            tag: persistent
            persistent: true
            ttl: 0

  notify_warnung:
    description: Sende eine Warnmeldung (Persistent, Flur, Mobile)
    fields:
      msg_title:
        description: "Der Titel der schriftlichen Benachrichtigung"
        example: "AWF1877 Heizungsregelung Info"
      msg_text:
        description: "The message content"
        example: "Problem mit Heizung. Bitte prüfen."
    sequence:
      - action: input_boolean.turn_on
        entity_id: input_boolean.system_meldung_warn
      - action: notify.werner_thomas_plus
        data:
          title: "{{ msg_title }}"
          message: "{{ msg_text }}"
          data:
            channel: Warnmeldung

  notify_info:
    description: Sende eine Infomeldung (Persistent, Flur, Mobile)
    fields:
      msg_title:
        description: "Der Titel der schriftlichen Benachrichtigung"
        example: "AWF1877 Heizungsregelung Info"
      msg_text:
        description: "The message content"
        example: "Problem mit Heizung. Bitte prüfen."
    sequence:
      - action: notify.werner_thomas_plus
        data:
          title: "{{ msg_title }}"
          message: "{{ msg_text }}"
          data:
            channel: Infomeldung

################################################################################

automation:
  - alias: Warnmeldung via Flur Buzzer
    mode: restart
    trigger:
      - alias: Flag frisch gesetzt
        trigger: state
        entity_id: input_boolean.system_meldung_warn
        to: "on"
      - alias: Regelmäßige Erinnerung
        trigger: time_pattern
        minutes: "/30"
      - alias: Bewegung im Flur
        trigger: state
        entity_id: binary_sensor.flur_og_bewegungsmelder_uv_occupancy
        to: "on"
    condition:
      - condition: state
        entity_id: input_boolean.system_meldung_warn
        state: "on"
    action:
      - action: esphome.haus_uv_astra_play_rtttl
        data:
          song_str: siren:d=8,o=5,b=100:d,e,c

  - alias: Alarmmeldung via Flur Buzzer
    mode: restart
    trigger:
      - alias: Flag frisch gesetzt
        trigger: state
        entity_id: input_boolean.system_meldung_alarm
        to: "on"
      - alias: Regelmäßige Erinnerung
        trigger: time_pattern
        seconds: "/10"
    condition:
      - condition: state
        entity_id: input_boolean.system_meldung_alarm
        state: "on"
    action:
      - action: esphome.haus_uv_astra_play_rtttl
        data:
          song_str: siren:d=8,o=5,b=100:d,e,d,e,c,f,d,e
