automation:
  - alias: Kinderzimmer Soundsystem standardmäßig auf Eingang 2 wechseln
    id: "12345"
    triggers:
      - trigger: state
        entity_id: switch.kinderzimmer_unterputzsteckdose
        to: "on"
    actions:
      - alias: Warte auf Boxensystem aktiv
        wait_template: "{{ states('sensor.kinderzimmer_unterputzsteckdose_energy_power') | float(0) > 32 }}"
        timeout:
          minutes: 2
        continue_on_timeout: false
      - alias: Pinge zMote
        action: homeassistant.update_entity
        target:
          entity_id: binary_sensor.kinderzimmer_zmote_ping
      - alias: Warte auf zMote
        wait_template: "{{ not is_state('button.kinderzimmer_teufel_soundsystem_input_ir', 'unavailable') }}"
        timeout:
          minutes: 2
        continue_on_timeout: false
      - action: button.press
        target:
          entity_id: button.kinderzimmer_teufel_soundsystem_input_ir

  - alias: Kinderzimmer Licht Taster links unten Schaltet Beamer ein
    triggers:
      - trigger: device
        domain: mqtt
        device_id: 6a19e5bf596a51352f9ccf398710e027
        type: action
        subtype: 3_double
    conditions:
      - alias: Beamer ist nicht aktiv und Verbrauch ist nahe Null
        condition: numeric_state
        entity_id: sensor.kinderzimmer_beamer_schaltmodul_energy_power
        below: 10
    actions:
      - action: switch.turn_on
        target:
          entity_id:
            - switch.kinderzimmer_beamer_schaltmodul
            - switch.kinderzimmer_teufel_soundsystem
      - delay:
          seconds: 1
      - alias: Pinge zMote
        action: homeassistant.update_entity
        target:
          entity_id: binary_sensor.kinderzimmer_zmote_ping
      - alias: Warte auf zMote
        wait_template: "{{ not is_state('button.kinderzimmer_epson_beamer_power_ir', 'unavailable') }}"
        timeout:
          minutes: 5
        continue_on_timeout: false
      - action: button.press
        target:
          entity_id: button.kinderzimmer_epson_beamer_power_ir
      - delay:
          seconds: 1
      - action: button.press
        target:
          entity_id: button.kinderzimmer_epson_beamer_power_ir
      - delay:
          seconds: 1
      - action: button.press
        target:
          entity_id: button.kinderzimmer_epson_beamer_power_ir
      - delay:
          seconds: 1
      - action: button.press
        target:
          entity_id: button.kinderzimmer_teufel_soundsystem_input_ir
      - action: media_player.turn_on
        target:
          entity_id: media_player.shield_android_tv

  - alias: Kinderzimmer Licht Taster links unten Schaltet Beamer aus
    triggers:
      - trigger: device
        domain: mqtt
        device_id: 6a19e5bf596a51352f9ccf398710e027
        type: action
        subtype: 3_double
    conditions:
      - alias: Beamer ist aktiv und verbraucht Strom
        condition: numeric_state
        entity_id: sensor.kinderzimmer_beamer_schaltmodul_energy_power
        above: 10
    actions:
      - alias: Warte auf zMote
        wait_template: "{{ not is_state('button.kinderzimmer_epson_beamer_power_ir', 'unavailable') }}"
        timeout:
          minutes: 5
        continue_on_timeout: false
      - action: button.press
        target:
          entity_id: button.kinderzimmer_epson_beamer_power_ir
      - delay:
          seconds: 1
      - action: button.press
        target:
          entity_id: button.kinderzimmer_epson_beamer_power_ir
      - delay:
          seconds: 1
      - action: button.press
        target:
          entity_id: button.kinderzimmer_epson_beamer_power_ir
      - delay:
          seconds: 5
      - action: switch.turn_off
        target:
          entity_id:
            - switch.kinderzimmer_beamer_schaltmodul
            - switch.kinderzimmer_teufel_soundsystem
