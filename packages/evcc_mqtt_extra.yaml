# evcc — abgeleitete Sensoren
#
# Werte, die nicht direkt von evcc kommen, sondern aus den MQTT-Sensoren
# berechnet werden.

template:
  - sensor:
      # Startzeitpunkt der aktuellen Ladung (auf 5 Minuten gerundet).
      # Liefert 0, wenn aktuell nicht geladen wird.
      - name: evcc_charge_duration_since
        unique_id: uniqueid__evcc_charge_duration_since
        icon: mdi:calendar-clock
        device_class: timestamp
        state: >
          {% if is_state("binary_sensor.evcc_loadpoint_charging", "off") %}
            0
          {% else %}
            {{ ((as_timestamp(now() - timedelta(seconds=(states.sensor.evcc_charge_duration_s.state | int))) / 300) | round() * 300) | timestamp_local() }}
          {% endif %}
        availability: >
          {{ has_value("sensor.evcc_charge_duration_s") }}

      # Hausverbrauch ohne Wallbox-Anteil (für realistischere Lastdarstellung).
      - name: irene_home_power_excluding_wallbox
        unique_id: uniqueid__irene_home_power_excluding_wallbox
        icon: mdi:home-lightning-bolt-outline
        device_class: power
        unit_of_measurement: "W"
        state_class: measurement
        state: >
          {{ states("sensor.kostal_plenticore_scb_home_power") | float
             - states("sensor.evcc_charge_power_w") | float }}
        availability: >
          {{ has_value("sensor.kostal_plenticore_scb_home_power")
             and has_value("sensor.evcc_charge_power_w") }}
