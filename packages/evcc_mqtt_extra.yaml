template:
  - sensor:
      - name: evcc_charge_duration_since
        unique_id: uniqueid__evcc_charge_duration_since
        state: >
          {% if is_state("binary_sensor.evcc_loadpoint_charging", "off") %}
            0
          {% else %}
            {{ ((as_timestamp(now() - timedelta(seconds=(states.sensor.evcc_charge_duration_s.state | int))) / 300) | round() * 300) | timestamp_local() }}
          {% endif %}
        availability: >
          {{ false if is_state("sensor.evcc_charge_duration_s", "unavailable") else true }}
        icon: mdi:calendar-clock
        device_class: timestamp

      - name: irene_home_power_excluding_wallbox
        unique_id: uniqueid__irene_home_power_excluding_wallbox
        state: >
          {{ states("sensor.kostal_plenticore_scb_home_power") | float - states("sensor.evcc_charge_power_w") | float }}
        availability: >
          {{ false if is_state("sensor.kostal_plenticore_scb_home_power", "unavailable") or is_state("sensor.evcc_charge_power_w", "unavailable") else true }}
        icon: mdi:calendar-clock
        device_class: power
        unit_of_measurement: W
