irrigation_unlimited:
  controllers:
    - name: Gartenbewaesserung
      preamble:
        minutes: 2
        seconds: 30
      postamble:
        minutes: 2
        seconds: 30

      zones:
        - zone_id: "1"
          name: Zone 1
          entity_id: switch.gartenbewaesserung_astra_ventil_1
        - zone_id: "2"
          name: Zone 2
          entity_id: switch.gartenbewaesserung_astra_ventil_2
        - zone_id: "3"
          name: Zone 3
          entity_id: switch.gartenbewaesserung_astra_ventil_3
        - zone_id: "4"
          name: Zone 4
          entity_id: switch.gartenbewaesserung_astra_ventil_4

      sequences:
        - schedules:
            - name: Sonnenaufgang
              time:
                sun: sunrise
                after:
                  minutes: 60
          delay:
            minutes: 1 # zwischen Zonen
          zones:
            - zone_id: 2
              duration:
                minutes: 60
            - zone_id: 3
              duration:
                minutes: 60
            - zone_id: 4
              duration:
                minutes: 30

################################################################################

input_number:
  gartenbewaesserung_smart_irrigation_offset_minutes:
    name: Gartenbewässerung Smart Irrigation Offset (Minutes)
    unit_of_measurement: "min"
    icon: mdi:clock-plus-outline
    min: 0
    max: 60
    step: 1

