automation:
  # remote_button_single_press
  # remote_button_double_press
  # remote_button_long_press - Achtung, circa 2-3s

  - alias: Kinderzimmer Licht Taster rechts unten
    trigger:
      - trigger: device
        domain: mqtt
        device_id: 6a19e5bf596a51352f9ccf398710e027
        type: action
        subtype: 4_single
    action:
      - if:
          - condition: state
            entity_id: light.kinderzimmer_deckenlampe_vorn
            state: "off"
          - condition: state
            entity_id: light.kinderzimmer_deckenlampe_hinten
            state: "off"
        then:
          - action: light.turn_on
            target:
              entity_id: light.kinderzimmer_deckenlampe_vorn
            data:
              brightness_pct: 60
          - action: light.turn_on
            target:
              entity_id: light.kinderzimmer_deckenlampe_hinten
            data:
              brightness_pct: 60
        else:
          - action: light.turn_off
            target:
              entity_id: light.kinderzimmer_deckenlampe_vorn
          - action: light.turn_off
            target:
              entity_id: light.kinderzimmer_deckenlampe_hinten

  - alias: Kinderzimmer Licht Taster rechts oben
    trigger:
      - trigger: device
        domain: mqtt
        device_id: 6a19e5bf596a51352f9ccf398710e027
        type: action
        subtype: 2_single
    action:
      - if:
          - condition: state
            entity_id: light.kinderzimmer_wandlampe_vorn
            state: "off"
          - condition: state
            entity_id: light.kinderzimmer_wandlampe_hinten
            state: "off"
          - condition: state
            entity_id: light.kinderzimmer_eckstehlampe_unten
            state: "off"
          - condition: state
            entity_id: light.kinderzimmer_eckstehlampe_oben
            state: "off"
        then:
          - action: light.turn_on
            target:
              entity_id: light.kinderzimmer_wandlampe_vorn
          - action: light.turn_on
            target:
              entity_id: light.kinderzimmer_wandlampe_hinten
            data:
              brightness_pct: 20
          - action: light.turn_on
            target:
              entity_id: light.kinderzimmer_eckstehlampe_unten
          - action: light.turn_on
            target:
              entity_id: light.kinderzimmer_eckstehlampe_oben
        else:
          - action: light.turn_off
            target:
              entity_id: light.kinderzimmer_wandlampe_vorn
          - action: light.turn_off
            target:
              entity_id: light.kinderzimmer_wandlampe_hinten
          - action: light.turn_off
            target:
              entity_id: light.kinderzimmer_eckstehlampe_unten
          - action: light.turn_off
            target:
              entity_id: light.kinderzimmer_eckstehlampe_oben

  - alias: Kinderzimmer Licht Taster links oben (Flur)
    trigger:
      - trigger: device
        domain: mqtt
        device_id: 6a19e5bf596a51352f9ccf398710e027
        type: action
        subtype: 1_single
    action:
      - if:
          - condition: state
            entity_id: light.haus_uv_astra_flur_oben_deckenlicht
            state: "off"
        then:
          - action: light.turn_on
            entity_id: light.haus_uv_astra_flur_oben_deckenlicht
        else:
          - action: light.turn_off
            entity_id: light.haus_uv_astra_flur_oben_deckenlicht
