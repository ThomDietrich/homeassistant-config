waste_collection_schedule:
  sources:
    #- name: ics
    #  args:
    #    url: https://portal.muellabfuhr-deutschland.de/api-portal/mandators/12/cal/location/bc3bc03d-9db6-40f1-a717-b644d9f1d264/pickups/ics?fractionIds=12004&fractionIds=12006&fractionIds=12001&fractionIds=12003&fractionIds=12002&year={{%Y}}
    - name: "muellabfuhr_de"
      args:
        client: Landkreis Sömmerda
        city: Riethnordhausen
      calendar_title: Abfallwirtschaft Landkreis Sömmerda
      customize:
        - type: "Biotonne"
          show: False
        - type: "Container für Baum- und Strauchschnitt"
          show: False
  fetch_time: "03:00"
  random_fetch_time_offset: 120
  day_switch_time: "11:00"
  separator: ", "

sensor:
  - platform: waste_collection_schedule
    name: waste_collection_next
    details_format: appointment_types
    value_template: >-
      {% if value.daysTo == 0 %}
        Heute {{ value.types|join(" & ") }}
      {% elif value.daysTo == 1 %}
        Morgen {{ value.types|join(" & ") }}
      {% elif value.daysTo == 2 %}
        Übermorgen {{ value.types|join(" & ") }}
      {% else %}
        In {{ value.daysTo }} Tagen {{ value.types|join(" & ") }}
      {% endif %}

  - platform: waste_collection_schedule
    name: waste_collection_next_tage
    count: 3
    value_template: "{{ value.daysTo }}"

  - platform: waste_collection_schedule
    name: waste_collection_next_type
    count: 3
    value_template: '{{ value.types|join("&") }}'
