input_select:
  waschmaschine_opstate:
    name: Waschmaschine OpState
    icon: mdi:washing-machine
    options:
      - "Off"
      - "Active"
      - "Finished"
    initial: "Off"

automation:
  - id: "1609362853002"
    alias: Waschmaschine StateMachine zu Active
    triggers:
      - trigger: numeric_state
        entity_id: sensor.keller_waschmaschine_shp5_energy_power
        above: 30
        for:
          seconds: 30
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.waschmaschine_opstate
            state: "Active"
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.waschmaschine_opstate
        data:
          option: "Active"

  - id: "1609362853005"
    alias: Waschmaschine StateMachine Übergang zu Finished
    triggers:
      - trigger: numeric_state
        entity_id: sensor.keller_waschmaschine_shp5_energy_power
        below: 2
        for:
          minutes: 5
    conditions:
      - condition: state
        entity_id: input_select.waschmaschine_opstate
        state:
          - "Active"
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.waschmaschine_opstate
        data:
          option: "Finished"

  - id: "1609362853003"
    alias: Waschmaschine StateMachine zu Off nach einer Stunde in Finished
    triggers:
      - trigger: state
        entity_id: input_select.waschmaschine_opstate
        to: "Finished"
        for:
          hours: 1
          minutes: 30
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.waschmaschine_opstate
        data:
          option: "Off"

  ##############################################################################

  - id: "1609362853004"
    alias: Waschmaschine fertig Benachrichtigung
    triggers:
      - trigger: state
        entity_id: input_select.waschmaschine_opstate
        to: "Finished"
    actions:
      - action: notify.persistent_notification
        data:
          message: Waschmaschine fertig!
