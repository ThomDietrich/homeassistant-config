# Configure a default setup of Home Assistant (frontend, api, etc)
#default_config:
# https://github.com/abjugard/homeassistant-mostly_default_config
mostly_default_config:
  exclude:
    - cloud
    - map

tts:
  - platform: google_translate

group: !include groups.yaml
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

homeassistant:
  packages: !include_dir_named packages

frontend:
  themes: !include_dir_merge_named themes

recorder:
  purge_keep_days: 3
  auto_purge: true

logger:
  default: info
  logs:
    #homeassistant.core: info
    homeassistant.components.mqtt: info

logbook:
  exclude:
    entities:
      - sensor.epaper_display_oben_last_update
      - sensor.watchman_last_updated
      - automation.regel_heizungsregelung_gastherme_sollwert_uber_prozent_schieberegler
      - automation.regel_heizungsregelung_gastherme_sollwert_uber_em10_vorlauftemperatur
      - automation.regel_heizungsregelung_gastherme_sollwert_uber_volt_schieberegler
      #- automation.regel_heizungsregelung_heizung_folgt_heizkennlinie

# CalDAV Kalender
calendar:
  - platform: caldav
    username: !secret caldav_user
    password: !secret caldav_password
    url: !secret caldav_url
    calendars:
      - !secret caldav_calendar_1
      - !secret caldav_calendar_2
    days: 30

zha:
  zigpy_config:
    ota:
      extra_providers:
        - type: ikea
        - type: ledvance

zha_toolkit:

favicon:
  title: AWF1877 – HomeAssistant
  icon_path: /local/favicons/
