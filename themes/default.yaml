default:
  # It is a common issue that the middle column on a device page is not wide
  # enough to read the complete entity name. This mod changes the page to a two-column style.
  devicepage-wide-columns-path: "/config/devices/device"
  devicepage-wide-columns-selector: "home-assistant-main$partial-panel-resolver ha-panel-config ha-config-devices ha-config-device-page$hass-subpage"
  devicepage-wide-columns-style: |
    .column:nth-child(3) {
      width: 66%;
    }
    .column:nth-child(4) {
      width: 100%;
    }

  yellow-drawer-selector: 'home-assistant-main$ha-drawer'
  yellow-drawer-style: |
    ha-sidebar {
      background-color: white;
    }
